<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>LangGraph Agent - Symmetrical Layout (Synced)</title>
  <style>
    :root {
      /* 核心调色板 */
      --bg-color: #f8fafc;
      --grid-color: #e2e8f0;
      
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;

      /* 节点状态颜色 */
      --node-agent: #3b82f6; 
      --node-tool: #f59e0b;
      --node-grader: #10b981;
      --node-gen: #8b5cf6;
      
      /* 动画总时长 */
      --duration: 12s;
    }

    body {
      margin: 0; padding: 0;
      background: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Segoe UI", Roboto, monospace;
      display: flex; justify-content: center; align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 1000px;
      height: 640px;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.15);
      position: relative;
      overflow: hidden;
      border: 1px solid #fff;
    }

    /* ---- 背景网格 ---- */
    .bg-grid {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        radial-gradient(var(--grid-color) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.6;
      z-index: 0;
    }

    svg { 
      display: block; 
      width: 100%; 
      height: 100%; 
      position: relative; 
      z-index: 1; 
    }

    /* ---- 节点通用样式 ---- */
    .node-group { cursor: default; }
    
    .node-card-bg {
      fill: #fff;
      stroke: #e2e8f0;
      stroke-width: 2;
      rx: 20;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.06));
    }

    /* 激活时的描边动画 */
    .node-active-stroke {
      fill: none;
      stroke-width: 4;
      stroke-opacity: 0;
      rx: 20;
      /* 移除 transition，完全由 keyframes 控制，避免时间偏差 */
    }

    .node-icon-bg { fill: #f1f5f9; rx: 12; }
    .node-title { font-size: 15px; font-weight: 800; fill: var(--text-main); letter-spacing: 0.5px; text-transform: uppercase; font-family: sans-serif; }
    .node-desc { font-size: 13px; fill: var(--text-sub); font-weight: 500; font-family: sans-serif; }

    /* ---- 连线样式 ---- */
    .edge-path {
      fill: none;
      stroke: #cbd5e1;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.6;
    }
    
    .edge-loop {
      fill: none;
      stroke: #cbd5e1;
      stroke-width: 3;
      stroke-dasharray: 8 6;
      opacity: 0.4;
    }

    /* ---- 粒子流 ---- */
    .flow-particle {
      fill: #fff;
      stroke-width: 0;
      r: 6; /* 加大粒子尺寸 */
      opacity: 0;
      filter: drop-shadow(0 0 5px currentColor);
    }

    /* ---- 关键帧动画 (精确校准版) ---- */
    /* Rule: 
      Flow Duration: 12.5% (1.5s)
      Buffer: 0.5% (0.06s) -> 确保粒子消失
      Node Active Duration: 11.5% (1.38s)
      Cycle: 25% (3.0s) per stage
    */

    /* 1. Flow User -> Agent (0% - 12.5%) */
    @keyframes seq-flow-1 { 
      0% { offset-distance: 0%; opacity: 0; } 
      2% { opacity: 1; } 
      12.5% { offset-distance: 100%; opacity: 1; } 
      13%, 100% { offset-distance: 100%; opacity: 0; } 
    }

    /* 2. Agent Active (13% - 24.5%) */
    @keyframes seq-agent { 
      0%, 13% { stroke-opacity: 0; } 
      13.1%, 24.5% { stroke-opacity: 1; stroke: var(--node-agent); } 
      25%, 100% { stroke-opacity: 0; } 
    }

    /* 3. Flow Agent -> Tool (25% - 37.5%) */
    @keyframes seq-flow-2 { 
      0%, 25% { offset-distance: 0%; opacity: 0; } 
      27% { opacity: 1; } 
      37.5% { offset-distance: 100%; opacity: 1; } 
      38%, 100% { offset-distance: 100%; opacity: 0; } 
    }

    /* 4. Tool Active (38% - 49.5%) */
    @keyframes seq-tool { 
      0%, 38% { stroke-opacity: 0; } 
      38.1%, 49.5% { stroke-opacity: 1; stroke: var(--node-tool); } 
      50%, 100% { stroke-opacity: 0; } 
    }

    /* 5. Flow Tool -> Grader (50% - 62.5%) */
    @keyframes seq-flow-3 { 
      0%, 50% { offset-distance: 0%; opacity: 0; } 
      52% { opacity: 1; } 
      62.5% { offset-distance: 100%; opacity: 1; } 
      63%, 100% { offset-distance: 100%; opacity: 0; } 
    }

    /* 6. Grader Active (63% - 74.5%) */
    @keyframes seq-grader { 
      0%, 63% { stroke-opacity: 0; } 
      63.1%, 74.5% { stroke-opacity: 1; stroke: var(--node-grader); } 
      75%, 100% { stroke-opacity: 0; } 
    }

    /* 7. Flow Grader -> Gen (75% - 87.5%) */
    @keyframes seq-flow-4 { 
      0%, 75% { offset-distance: 0%; opacity: 0; } 
      77% { opacity: 1; } 
      87.5% { offset-distance: 100%; opacity: 1; } 
      88%, 100% { offset-distance: 100%; opacity: 0; } 
    }

    /* 8. Gen Active (88% - 99.5%) */
    @keyframes seq-gen { 
      0%, 88% { stroke-opacity: 0; } 
      88.1%, 99.5% { stroke-opacity: 1; stroke: var(--node-gen); } 
      100% { stroke-opacity: 0; } 
    }
    
    .p-1 { animation: seq-flow-1 var(--duration) linear infinite; fill: var(--text-sub); }
    .a-1 { animation: seq-agent var(--duration) linear infinite; }
    
    .p-2 { animation: seq-flow-2 var(--duration) linear infinite; fill: var(--node-agent); }
    .a-2 { animation: seq-tool var(--duration) linear infinite; }
    
    .p-3 { animation: seq-flow-3 var(--duration) linear infinite; fill: var(--node-tool); }
    .a-3 { animation: seq-grader var(--duration) linear infinite; }
    
    .p-4 { animation: seq-flow-4 var(--duration) linear infinite; fill: var(--node-grader); }
    .a-4 { animation: seq-gen var(--duration) linear infinite; }


    /* ---- 底部日志控制台 ---- */
    .log-panel {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      height: 150px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      padding: 20px;
      box-sizing: border-box;
      z-index: 20;
      display: flex;
      flex-direction: column;
    }
    
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    
    .log-dots { display: flex; gap: 8px; }
    .log-dot { width: 10px; height: 10px; border-radius: 50%; }
    .ld-r { background: #f87171; } .ld-y { background: #fbbf24; } .ld-g { background: #34d399; }
    .log-title { font-size: 11px; color: #94a3b8; letter-spacing: 1.5px; font-weight: 700; }

    .log-content {
      flex: 1;
      font-size: 13px;
      color: #334155; 
      line-height: 1.8;
      overflow: hidden;
      position: relative;
    }

    .log-line { display: flex; gap: 12px; opacity: 0; animation: var(--duration) infinite; }
    .ts { color: #cbd5e1; width: 40px; font-weight: 500; } 
    
    /* 日志出现动画 - 同步节点激活时间 */
    @keyframes log-appear-1 { 0%, 12.9% { opacity: 0; transform: translateY(5px); } 13.1%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes log-appear-2 { 0%, 37.9% { opacity: 0; transform: translateY(5px); } 38.1%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes log-appear-3 { 0%, 62.9% { opacity: 0; transform: translateY(5px); } 63.1%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes log-appear-4 { 0%, 87.9% { opacity: 0; transform: translateY(5px); } 88.1%, 100% { opacity: 1; transform: translateY(0); } }

    .l-1 { animation-name: log-appear-1; }
    .l-2 { animation-name: log-appear-2; }
    .l-3 { animation-name: log-appear-3; }
    .l-4 { animation-name: log-appear-4; }

    /* 输出卡片 - 在 Gen (88%) 后弹出 */
    @keyframes pop-center {
      0%, 92% { transform: translate(-50%, 20px) scale(0.95); opacity: 0; }
      94%, 99% { transform: translate(-50%, 0) scale(1); opacity: 1; }
      100% { transform: translate(-50%, 0) scale(1); opacity: 0; }
    }
    
    .output-card-container {
      position: absolute;
      top: 350px;
      left: 50%;
      transform: translate(-50%, 20px);
      opacity: 0;
      animation: pop-center var(--duration) ease-in-out infinite;
      z-index: 30;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border-radius: 16px;
      padding: 20px 30px;
      width: 260px;
      text-align: center;
    }

  </style>
</head>
<body>

<div class="container">
  <div class="bg-grid"></div>

  <!-- 日志面板 (浅色) -->
  <div class="log-panel">
    <div class="log-header">
      <div class="log-dots"><div class="log-dot ld-r"></div><div class="log-dot ld-y"></div><div class="log-dot ld-g"></div></div>
      <div class="log-title">LANGGRAPH::TRACE</div>
    </div>
    <div class="log-content">
      <div class="log-line l-1">
        <span class="ts">1.6s</span>
        <span><strong style="color:var(--node-agent)">INFO</strong> [Agent] Analyzing user intent...</span>
      </div>
      <div class="log-line l-2">
        <span class="ts">4.6s</span>
        <span><strong style="color:var(--node-tool)">INFO</strong> [Tool] Searching VectorDB...</span>
      </div>
      <div class="log-line l-3">
        <span class="ts">7.6s</span>
        <span><strong style="color:var(--node-grader)">INFO</strong> [Grader] Relevance: 0.98 (Pass)</span>
      </div>
      <div class="log-line l-4">
        <span class="ts">10.6s</span>
        <span><strong style="color:var(--node-gen)">DONE</strong> [Gen] Response synthesized.</span>
      </div>
    </div>
  </div>

  <!-- 输出卡片 -->
  <div class="output-card-container">
    <div class="glass-card">
      <div style="color:var(--node-grader); font-size:11px; font-weight:800; letter-spacing:1px; margin-bottom:8px;">FINAL ANSWER</div>
      <div style="font-size:15px; color:#1e293b; font-weight:600;">Phase 3 Integration</div>
      <div style="font-size:12px; color:#64748b; margin-top:4px;">Status: On Track</div>
    </div>
  </div>

  <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Marker 放大 -->
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1" />
      </marker>
    </defs>

    <!-- 连接线 (Center Y = 278) -->
    <g>
      <!-- User(Edge 185) -> Agent(230) -->
      <line x1="185" y1="278" x2="230" y2="278" class="edge-path" marker-end="url(#arrow)" />
      <!-- Agent(380) -> Tool(425) -->
      <line x1="380" y1="278" x2="425" y2="278" class="edge-path" marker-end="url(#arrow)" />
      <!-- Tool(575) -> Grader(620) -->
      <line x1="575" y1="278" x2="620" y2="278" class="edge-path" marker-end="url(#arrow)" />
      <!-- Grader(770) -> Gen(815) -->
      <line x1="770" y1="278" x2="815" y2="278" class="edge-path" marker-end="url(#arrow)" />

      <!-- Loop: Grader(Center 695) -> Agent(Center 305) -->
      <!-- Start/End Y at top of nodes: 278 - 48 = 230 -->
      <path d="M 695 230 Q 500 100 305 230" class="edge-loop" marker-end="url(#arrow)" fill="none"/>
      
      <!-- Loop Label -->
      <rect x="460" y="145" width="80" height="24" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="500" y="161" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="600">REWRITE</text>
    </g>

    <!-- 粒子层 -->
    <g>
      <circle r="5" class="flow-particle p-1" style="offset-path: path('M185,278 L230,278');" />
      <circle r="5" class="flow-particle p-2" style="offset-path: path('M380,278 L425,278');" />
      <circle r="5" class="flow-particle p-3" style="offset-path: path('M575,278 L620,278');" />
      <circle r="5" class="flow-particle p-4" style="offset-path: path('M770,278 L815,278');" />
    </g>

    <!-- 节点层 (Y Offset for Rects: 278 - 48 = 230) -->
    <g>
      <!-- 1. USER (Center 150) -->
      <g transform="translate(150, 278)">
        <circle r="35" fill="#fff" stroke="#e2e8f0" stroke-width="3"/>
        <text x="0" y="55" text-anchor="middle" font-size="12" fill="#94a3b8" font-weight="700" letter-spacing="1px">QUERY</text>
        <g transform="scale(1.2) translate(-12, -12)"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#94a3b8"/></g>
      </g>

      <!-- 2. AGENT (230, 230) Size 150x96 -->
      <g transform="translate(230, 230)" class="node-group">
        <rect width="150" height="96" class="node-card-bg" />
        <rect width="150" height="96" class="node-active-stroke a-1" />
        <rect x="55" y="16" width="40" height="40" class="node-icon-bg" />
        <!-- Icon Center: 75, 36 -->
        <g transform="translate(75, 36) scale(1.2)">
            <circle cx="0" cy="0" r="3" fill="var(--node-agent)"/>
            <circle cx="0" cy="0" r="8" stroke="var(--node-agent)" stroke-width="1.5" fill="none" opacity="0.6"/>
        </g>
        <text x="75" y="70" text-anchor="middle" class="node-title">Agent</text>
        <text x="75" y="86" text-anchor="middle" class="node-desc">Router</text>
      </g>

      <!-- 3. TOOL (425, 230) Size 150x96 -->
      <g transform="translate(425, 230)" class="node-group">
        <rect width="150" height="96" class="node-card-bg" />
        <rect width="150" height="96" class="node-active-stroke a-2" />
        <rect x="55" y="16" width="40" height="40" class="node-icon-bg" />
        <g transform="translate(75, 36) scale(1.2)">
            <circle cx="0" cy="0" r="6" stroke="var(--node-tool)" stroke-width="2" fill="none"/>
            <line x1="4" y1="4" x2="8" y2="8" stroke="var(--node-tool)" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="75" y="70" text-anchor="middle" class="node-title">Tool</text>
        <text x="75" y="86" text-anchor="middle" class="node-desc">Retriever</text>
      </g>

      <!-- 4. GRADER (620, 230) Size 150x96 -->
      <g transform="translate(620, 230)" class="node-group">
        <rect width="150" height="96" class="node-card-bg" />
        <rect width="150" height="96" class="node-active-stroke a-3" />
        <rect x="55" y="16" width="40" height="40" class="node-icon-bg" />
        <g transform="translate(75, 36) scale(1.2)">
            <polyline points="-6,0 -2,4 6,-4" fill="none" stroke="var(--node-grader)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <text x="75" y="70" text-anchor="middle" class="node-title">Grader</text>
        <text x="75" y="86" text-anchor="middle" class="node-desc">Evaluator</text>
      </g>

      <!-- 5. GEN (815, 230) Size 150x96 -->
      <g transform="translate(815, 230)" class="node-group">
        <rect width="150" height="96" class="node-card-bg" />
        <rect width="150" height="96" class="node-active-stroke a-4" />
        <rect x="55" y="16" width="40" height="40" class="node-icon-bg" />
        <g transform="translate(66, 28) scale(1.2)">
            <path d="M7.5 0L8.5 4.5L13 5.5L8.5 6.5L7.5 11L6.5 6.5L2 5.5L6.5 4.5Z" fill="var(--node-gen)"/>
        </g>
        <text x="75" y="70" text-anchor="middle" class="node-title">LLM</text>
        <text x="75" y="86" text-anchor="middle" class="node-desc">Generate</text>
      </g>
    </g>
    
  </svg>
</div>

</body>
</html>
