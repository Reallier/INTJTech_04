<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Data Agent · Professional & Stable</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #cbd5e1;
      
      --accent-primary: #7c3aed; /* 核心紫 */
      --accent-secondary: #0ea5e9; /* 图表蓝 */
      --text-main: #0f172a;
      --text-sub: #64748b;
    }

    body {
      margin: 0; padding: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      height: 100vh;
      color: var(--text-main);
    }

    .container {
      width: 960px;
      /* 投影收敛一点，显得更实 */
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
      border-radius: 24px;
      background: #fff;
    }

    svg { display: block; width: 100%; height: auto; overflow: visible; }
    text { text-rendering: geometricPrecision; }

    /* ---- 静态样式 ---- */
    .track { 
      fill: none; stroke: #e2e8f0; stroke-width: 4; stroke-linecap: round; 
    }
    
    .flow-line {
      fill: none; stroke: var(--accent-primary); stroke-width: 4; stroke-linecap: round;
      stroke-dasharray: 20 300; stroke-dashoffset: 300; opacity: 0.4;
    }

    .card-base {
      fill: var(--surface); stroke: var(--border); stroke-width: 2;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.03));
    }

    /* 字体 (保持大号清晰) */
    .label-title { font-size: 18px; font-weight: 700; fill: var(--text-main); }
    .label-desc  { font-size: 13px; font-weight: 500; fill: var(--text-sub); }
    .label-tag   { font-size: 11px; font-weight: 700; fill: #a78bfa; letter-spacing: 0.05em; text-transform: uppercase; }

    /* 图表 */
    .bar-path { fill: var(--accent-secondary); transform-box: fill-box; transform-origin: bottom; }
    .pie-segment { fill: var(--accent-primary); transform-origin: center; }
    .data-particle { fill: var(--accent-primary); filter: drop-shadow(0 0 4px rgba(124, 58, 237, 0.5)); }

    /* ---- 动画编排 (回归稳健风格) ---- */
    .timeline {
      animation-duration: 5s;
      animation-iteration-count: infinite;
      animation-timing-function: linear;
      fill-mode: both;
    }

    /* 1. 粒子沿曲线飞行 */
    @keyframes move-curve-left {
      0% { offset-distance: 0%; opacity: 0; transform: scale(0.5); }
      10% { opacity: 1; transform: scale(1); }
      35% { offset-distance: 100%; opacity: 1; transform: scale(1); }
      40% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 0; }
    }
    @keyframes move-curve-mid {
      0%, 5% { offset-distance: 0%; opacity: 0; }
      15% { opacity: 1; }
      35% { offset-distance: 100%; opacity: 1; }
      40% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes move-curve-right {
      0%, 10% { offset-distance: 0%; opacity: 0; }
      20% { opacity: 1; }
      35% { offset-distance: 100%; opacity: 1; }
      40% { opacity: 0; }
      100% { opacity: 0; }
    }
    
    /* 管道流光 */
    @keyframes flow-dash {
      0% { stroke-dashoffset: 300; opacity: 0; }
      20% { opacity: 1; }
      50% { stroke-dashoffset: 0; opacity: 0; }
      100% { opacity: 0; }
    }

    /* 2. Agent 内部动效 (稳健版) */
    /* 旋转光环 */
    @keyframes spin-ring {
      0% { transform: rotate(0deg); opacity: 0.8; }
      50% { opacity: 1; }
      100% { transform: rotate(360deg); opacity: 0.8; }
    }
    /* 扫描线 (上下移动) */
    @keyframes scan-line {
      0% { transform: translateY(-60px); opacity: 0; }
      20% { opacity: 1; }
      50% { transform: translateY(60px); opacity: 1; }
      60% { opacity: 0; }
      100% { opacity: 0; }
    }

    /* 3. 报表动效 */
    @keyframes bar-grow {
      0%, 60% { transform: scaleY(0); }
      70% { transform: scaleY(1.05); } /* 微弹 */
      80%, 100% { transform: scaleY(1); }
    }
    @keyframes fade-in {
      0%, 60% { opacity: 0.5; transform: translateY(4px); }
      70%, 100% { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>
<body>

<div class="container">
  <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
    
    <defs>
      <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
      </pattern>
      <clipPath id="clip-agent"><rect width="320" height="140" rx="24" /></clipPath>
    </defs>
    
    <rect width="960" height="540" fill="url(#dot-grid)" />

    <defs>
      <path id="path-left" d="M 210 110 C 210 160, 420 140, 460 180" />
      <path id="path-mid" d="M 480 110 C 480 140, 480 150, 480 180" />
      <path id="path-right" d="M 750 110 C 750 160, 540 140, 500 180" />
      <path id="path-down" d="M 480 320 L 480 370" />
    </defs>


    <use href="#path-left" class="track" />
    <use href="#path-mid" class="track" />
    <use href="#path-right" class="track" />
    <use href="#path-down" class="track" />

    <use href="#path-left" class="flow-line timeline" style="animation-name: flow-dash;" />
    <use href="#path-mid" class="flow-line timeline" style="animation-name: flow-dash; animation-delay: 0.1s;" />
    <use href="#path-right" class="flow-line timeline" style="animation-name: flow-dash; animation-delay: 0.2s;" />
    <use href="#path-down" class="flow-line timeline" style="animation-name: flow-dash; animation-delay: 1.5s;" />


    <g transform="translate(120, 40)">
      <rect width="180" height="70" rx="16" class="card-base" />
      <circle cx="35" cy="35" r="8" fill="#94a3b8" />
      <text x="60" y="32" class="label-tag">SOURCE 01</text>
      <text x="60" y="52" class="label-title">SQL DB</text>
    </g>

    <g transform="translate(390, 40)">
      <rect width="180" height="70" rx="16" class="card-base" />
      <circle cx="35" cy="35" r="8" fill="#22c55e" />
      <text x="60" y="32" class="label-tag" style="fill:#86efac;">SOURCE 02</text>
      <text x="60" y="52" class="label-title">Excel Files</text>
    </g>

    <g transform="translate(660, 40)">
      <rect width="180" height="70" rx="16" class="card-base" />
      <circle cx="35" cy="35" r="8" fill="#0ea5e9" />
      <text x="60" y="32" class="label-tag" style="fill:#7dd3fc;">SOURCE 03</text>
      <text x="60" y="52" class="label-title">Cloud API</text>
    </g>


    <g transform="translate(320, 180)">
      <rect width="320" height="140" rx="24" class="card-base" style="stroke: #a78bfa; stroke-width: 3;" />
      
      <text x="160" y="45" text-anchor="middle" class="label-tag" style="font-size: 12px; fill: #7c3aed;">Data Intelligence Agent</text>
      <text x="160" y="80" text-anchor="middle" class="label-title" style="font-size: 24px;">数据清洗 & 结构化</text>
      
      <g transform="translate(160, 110)">
         <circle cx="0" cy="0" r="18" fill="none" stroke="#ddd6fe" stroke-width="4" stroke-dasharray="12 12" class="timeline" style="animation-name: spin-ring; animation-duration: 4s;" />
         <circle cx="0" cy="0" r="6" fill="#7c3aed" />
      </g>

      <g clip-path="url(#clip-agent)">
        <line x1="20" y1="70" x2="300" y2="70" stroke="#a78bfa" stroke-width="4" stroke-opacity="0.6" class="timeline" style="animation-name: scan-line;" />
      </g>
    </g>


    <g transform="translate(180, 370)">
      <rect width="600" height="140" rx="20" class="card-base timeline" style="animation-name: fade-in;" />
      
      <g transform="translate(30, 30)">
        <circle cx="8" cy="8" r="6" fill="#10b981" />
        <text x="24" y="14" class="label-title" style="font-size: 18px;">Q3 销售与转化分析报表.pdf</text>
        <rect x="500" y="4" width="40" height="20" rx="6" fill="#f1f5f9" />
        <text x="520" y="18" text-anchor="middle" class="label-tag" style="fill:#64748b;">PDF</text>

        <g transform="translate(40, 50)">
          <text x="0" y="-10" class="label-desc">Revenue Trend</text>
          <line x1="0" y1="50" x2="160" y2="50" stroke="#e2e8f0" stroke-width="3" />
          <path d="M 10 50 L 10 20 Q 10 16 14 16 L 36 16 Q 40 16 40 20 L 40 50 Z" class="bar-path timeline" style="animation-name: bar-grow;" />
          <path d="M 60 50 L 60 10 Q 60 6 64 6 L 86 6 Q 90 6 90 10 L 90 50 Z" class="bar-path timeline" style="animation-name: bar-grow; animation-delay: 0.1s; fill: #6366f1;" />
          <path d="M 110 50 L 110 25 Q 110 21 114 21 L 136 21 Q 140 21 140 25 L 140 50 Z" class="bar-path timeline" style="animation-name: bar-grow; animation-delay: 0.2s;" />
        </g>

        <g transform="translate(300, 50)">
           <text x="0" y="-10" class="label-desc">Key Metrics</text>
           <rect y="10" width="200" height="12" rx="4" fill="#f1f5f9" />
           <rect y="10" width="140" height="12" rx="4" fill="#e2e8f0" />
           <rect y="32" width="200" height="12" rx="4" fill="#f1f5f9" />
           <rect y="32" width="180" height="12" rx="4" fill="#e2e8f0" />
        </g>
      </g>
    </g>


    <circle r="6" class="data-particle timeline" style="animation-name: move-curve-left; offset-path: path('M 210 110 C 210 160, 420 140, 460 180');" />
    <circle r="6" class="data-particle timeline" style="animation-name: move-curve-mid; offset-path: path('M 480 110 C 480 140, 480 150, 480 180');" />
    <circle r="6" class="data-particle timeline" style="animation-name: move-curve-right; offset-path: path('M 750 110 C 750 160, 540 140, 500 180');" />
    
    <circle r="8" class="data-particle timeline" style="fill:#10b981; animation-name: move-curve-mid; animation-delay: 1.5s; offset-path: path('M 480 320 L 480 370');" />

  </svg>
</div>

</body>
</html>
