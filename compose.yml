services:
  zilshu-tech-site:
    image: ccr.ccs.tencentyun.com/reallier/zilshu-tech-site:latest
    environment:
      - NODE_ENV=production
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
    restart: always
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zilshu-tech-site.rule=Host(`intjsys.com`)"
      - "traefik.http.routers.zilshu-tech-site.entrypoints=websecure"
      - "traefik.http.routers.zilshu-tech-site.tls=true"
      - "traefik.http.routers.zilshu-tech-site.tls.certresolver=myresolver"
      - "traefik.http.services.zilshu-tech-site.loadbalancer.server.port=3000"

networks:
  traefik:
    external: true
