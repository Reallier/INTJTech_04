<svg width="420" height="320" viewBox="0 0 420 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景柔和光斑 -->
    <radialGradient id="bgGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 150) rotate(90) scale(200)">
      <stop stop-color="#6366F1" stop-opacity="0.16"></stop>
      <stop offset="1" stop-color="#EEF2FF" stop-opacity="0"></stop>
    </radialGradient>

    <!-- 连接线用的箭头 -->
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#CBD5F5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
    </marker>

    <!-- 卡片阴影 -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.14"></feDropShadow>
    </filter>
  </defs>

  <!-- 背景圆角面板 -->
  <rect x="16" y="16" width="388" height="288" rx="24" fill="white"></rect>
  <rect x="16.5" y="16.5" width="387" height="287" rx="24" stroke="#E5E7EB"></rect>

  <!-- 柔和光斑 -->
  <circle cx="260" cy="150" r="200" fill="url(#bgGlow)"></circle>

  <!-- 远处“系统”虚线框 / 提示工程架构 -->
  <rect x="56" y="48" width="140" height="72" rx="16" stroke="#E5E7EB" stroke-dasharray="4 6" stroke-width="1.1"></rect>
  <rect x="252" y="208" width="112" height="56" rx="16" stroke="#E5E7EB" stroke-dasharray="4 6" stroke-width="1.1"></rect>

  <!-- 点线节点背景网格 -->
  <g opacity="0.45">
    <!-- 横线 -->
    <line x1="72" y1="136" x2="360" y2="136" stroke="#EEF2FF" stroke-width="1"></line>
    <line x1="72" y1="176" x2="360" y2="176" stroke="#EEF2FF" stroke-width="1"></line>
    <line x1="72" y1="216" x2="360" y2="216" stroke="#EEF2FF" stroke-width="1"></line>
    <!-- 竖线 -->
    <line x1="120" y1="104" x2="120" y2="252" stroke="#EEF2FF" stroke-width="1"></line>
    <line x1="210" y1="104" x2="210" y2="252" stroke="#EEF2FF" stroke-width="1"></line>
    <line x1="300" y1="104" x2="300" y2="252" stroke="#EEF2FF" stroke-width="1"></line>
  </g>

  <!-- 卡片：输入 / 业务侧 -->
  <g filter="url(#cardShadow)">
    <rect x="72" y="132" width="110" height="68" rx="16" fill="white"></rect>
  </g>
  <rect x="72.5" y="132.5" width="109" height="67" rx="16" stroke="#E2E8F0" stroke-width="1.1"></rect>
  <!-- 卡片内容 -->
  <rect x="84" y="146" width="36" height="10" rx="5" fill="#E5E7EB"></rect>
  <rect x="84" y="166" width="64" height="8" rx="4" fill="#EEF2FF"></rect>
  <rect x="84" y="182" width="48" height="6" rx="3" fill="#F3F4F6"></rect>

  <!-- 卡片：Agent 核心逻辑 -->
  <g filter="url(#cardShadow)">
    <rect x="170" y="118" width="130" height="88" rx="18" fill="white"></rect>
  </g>
  <rect x="170.5" y="118.5" width="129" height="87" rx="18" stroke="#6366F1" stroke-width="1.4"></rect>

  <!-- 核心卡片内容 -->
  <rect x="188" y="134" width="64" height="12" rx="6" fill="#EEF2FF"></rect>
  <rect x="188" y="154" width="94" height="8" rx="4" fill="#E5E7EB"></rect>
  <rect x="188" y="170" width="80" height="6" rx="3" fill="#F3F4F6"></rect>

  <!-- 小标签：Routing / Tooling -->
  <rect x="188" y="188" width="40" height="14" rx="7" fill="#EEF2FF"></rect>
  <rect x="234" y="188" width="50" height="14" rx="7" fill="#EEF2FF" opacity="0.85"></rect>

  <!-- 卡片：输出 / 系统 -->
  <g filter="url(#cardShadow)">
    <rect x="288" y="144" width="88" height="64" rx="16" fill="white"></rect>
  </g>
  <rect x="288.5" y="144.5" width="87" height="63" rx="16" stroke="#E2E8F0" stroke-width="1.1"></rect>

  <!-- 输出卡片内容 -->
  <rect x="300" y="158" width="52" height="10" rx="5" fill="#E5E7EB"></rect>
  <rect x="300" y="176" width="40" height="6" rx="3" fill="#F3F4F6"></rect>
  <circle cx="340" cy="178" r="5" fill="#22C55E" opacity="0.9"></circle>

  <!-- 连接线 + 箭头 -->
  <g stroke="#CBD5F5" stroke-width="1.4" stroke-linecap="round">
    <line x1="182" y1="166" x2="170" y2="166"></line>
    <line x1="292" y1="166" x2="288" y2="166"></line>

    <!-- 输入 -> Agent -->
    <line x1="182" y1="166" x2="182" y2="166" marker-end="url(#arrowHead)"></line>
    <!-- Agent -> 输出 -->
    <line x1="288" y1="166" x2="288" y2="166" marker-end="url(#arrowHead)"></line>

    <!-- 从上方虚线框到 Agent 的辅助线 -->
    <line x1="170" y1="118" x2="160" y2="104" stroke-dasharray="3 5"></line>
    <line x1="300" y1="118" x2="318" y2="104" stroke-dasharray="3 5"></line>
  </g>

  <!-- 周边小节点：代表工具 / 第三方系统 -->
  <g>
    <circle cx="110" cy="112" r="4" fill="#6366F1" fill-opacity="0.9"></circle>
    <circle cx="326" cy="116" r="4" fill="#6366F1" fill-opacity="0.9"></circle>
    <circle cx="96" cy="228" r="3.5" fill="#A5B4FC" fill-opacity="0.9"></circle>
    <circle cx="332" cy="236" r="3.5" fill="#A5B4FC" fill-opacity="0.9"></circle>

    <!-- 节点连接线 -->
    <line x1="110" y1="112" x2="120" y2="136" stroke="#E5E7EB" stroke-width="1.1"></line>
    <line x1="326" y1="116" x2="318" y2="144" stroke="#E5E7EB" stroke-width="1.1"></line>
    <line x1="96" y1="228" x2="120" y2="208" stroke="#E5E7EB" stroke-width="1.1"></line>
    <line x1="332" y1="236" x2="320" y2="216" stroke="#E5E7EB" stroke-width="1.1"></line>
  </g>

  <!-- 轻微标签文字（可选，如果不想要可以删掉这一组） -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="10" fill="#6B7280" opacity="0.85">
    <text x="80" y="72">业务输入</text>
    <text x="260" y="232">外部系统</text>
    <text x="186" y="132">Agent Orchestrator</text>
  </g>
</svg>
